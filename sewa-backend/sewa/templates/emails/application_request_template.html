<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>New Application Received</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px;">
        <h1 style="color: #333333;">Hi, {{ application.property.owner.full_name }}!</h1>
        <p style="color: #666666; font-size: 16px; line-height: 1.5;">
            There is new application request for rent the property {{ application.property.name }}
        </p>
        <p style="color: #666666; font-size: 16px; line-height: 1.5;">
            Requested by: {{ application.requestor.full_name }}
        </p>
        <p style="color: #666666; font-size: 16px; line-height: 1.5;">
            Requested at: {{ application.created_at }}
        </p>
    </div>
</body>
</html>
